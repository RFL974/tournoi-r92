name: Déploiement GitHub Pages (dossier frontend)

# Vérifie le contenu de `frontend/`, et le publie sur GitHub Pages
# (URLs : https://rfl974.github.io/tournoi-r92/tournoi.html, /admin.html, …).
#
# ⚠️ DEPUIS LE CHANTIER C-013 (R-043) : rien ne part en ligne sans avoir été vérifié.
# Le travail `verifier` s'exécute AVANT `deploy`, et `deploy` en dépend (`needs`).
# Si un fichier JavaScript ne se lit pas, la publication N'A PAS LIEU : le site
# déjà en ligne reste intact.
#
# ═══════════════════════════════════════════════════════════════════════════════
# 🚨 POUSSER N'EST PAS PUBLIER — ET C'EST LE POINT LE PLUS IMPORTANT DE CE FICHIER.
#
# ⚡ Ce fichier annonçait « Publie le contenu de `frontend/` à chaque push sur main ».
# ⛔ C'ÉTAIT VRAI, et c'est précisément ce qui a été corrigé : `deploy` ne se déclenchait
# pas seulement pour une publication voulue — il partait à CHAQUE poussée touchant
# `frontend/**` ou ce fichier. Autrement dit, décider d'enregistrer du travail sur GitHub
# revenait à décider de le mettre EN LIGNE, sans que personne n'ait dit oui à la seconde
# décision. ⭐ Ce sont deux gestes, et ils demandent deux autorisations.
#
# ⭐ LE CONTRAT, DÉSORMAIS — et un garde-fou l'éprouve
# (`tests/pages-deploiement-manuel.test.js`) :
#
#   | Événement                                  | Vérifications | Déploiement |
#   |--------------------------------------------|---------------|-------------|
#   | Push sur `main` (chemins surveillés)       |      oui      |     NON     |
#   | Pull request (chemins surveillés)          |      oui      |     NON     |
#   | Déclenchement manuel, AUTRE branche        |      oui      |     NON     |
#   | Déclenchement manuel sur `main`            |      oui      | OUI, après  |
#
# ⭐ PUBLIER SE DEMANDE À LA MAIN : onglet « Actions » → ce workflow → « Run workflow »,
# en choisissant la branche `main`. ⛔ Aucun autre chemin ne publie.
#
# ⚠️ CE QUI N'A PAS CHANGÉ, et il ne faut pas le relâcher : les VÉRIFICATIONS tournent
# toujours à chaque poussée et à chaque proposition de fusion. ⭐ On voit donc un défaut
# au moment où il arrive — on choisit seulement, séparément, quand le site change.
# ═══════════════════════════════════════════════════════════════════════════════

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/pages.yml'
      # ⛔ `tests/**` N'EST PAS ici, et c'est délibéré : un commit qui ne touche QUE les
      # garde-fous ne change RIEN au site publié — inutile de relancer ce workflow pour lui.
      # ⚡ *(Ce commentaire disait « L'ajouter republierait Pages pour rien ». ⛔ Ce n'est plus
      # vrai depuis que le déploiement est MANUEL : un push ne publie plus. La raison de
      # l'exclusion tient donc désormais au coût, pas au risque.)*
      # ⭐ Les tests tournent quand même à chaque publication réelle : le travail `verifier`
      # les lance à chaque fois qu'il s'exécute, quel que soit le chemin qui l'a déclenché.
  # Le contrôle tourne aussi sur les propositions de fusion : on voit le problème
  # AVANT que le code n'atteigne `main`, pas après. ⛔ `deploy` n'y est pas atteignable —
  # ⭐ et depuis que la publication est manuelle, il ne l'est plus non plus depuis un push.
  pull_request:
    paths:
      - 'frontend/**'
      # ⭐ `tests/**` EST ici, et seulement ici : modifier un garde-fou doit permettre de
      # l'éprouver LUI-MÊME avant fusion — ⛔ sans jamais rien publier (une proposition de
      # fusion n'est pas un déclenchement manuel, donc `deploy` n'est pas atteignable).
      - 'tests/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch: {}

# Droits minimaux ici ; `deploy` demande les siens pour lui seul (voir plus bas).
# ⭐ Une exécution qui n'atteint pas `deploy` — une proposition de fusion, un push, un
# déclenchement manuel depuis une autre branche — n'obtient donc JAMAIS le droit d'écrire
# sur Pages : `pages: write` et `id-token: write` vivent DANS ce job, ⛔ jamais au-dessus.
permissions:
  contents: read

jobs:
  # --------------------------------------------------------------------------
  # 1) LE CONTRÔLE AVANT PUBLICATION — syntaxe + garde-fous comportementaux.
  #
  # ⚠️ Ce commentaire annonçait « syntaxe uniquement », et c'était vrai jusqu'au
  # lot M1-B2 / B2-0.1, qui a ajouté deux étapes de comportement plus bas.
  #
  # a) `node --check` répond à UNE seule question : « ce fichier est-il lisible ? ».
  #    Il ne juge ni le style, ni les conventions, ni la qualité. C'est délibéré :
  #    un contrôle trop exigeant qui refuserait de publier une correction urgente
  #    LE JOUR DU TOURNOI serait pire que pas de contrôle du tout.
  #    Portée : tous les `.js` de `frontend/`, bibliothèques extérieures comprises
  #    (elles sont déposées à la main, donc elles peuvent arriver tronquées).
  #    Le HTML n'est PAS vérifié : il ne contient aucun script en ligne, et
  #    contrôler sa syntaxe exigerait une dépendance que le projet a refusée.
  #
  # b) Les garde-fous de `tests/` répondent à l'autre question : « ce code fait-il
  #    encore ce qu'il doit faire ? ». ⛔ Ils restent VOLONTAIREMENT peu nombreux —
  #    TROIS comportements sont gardés aujourd'hui (la réinitialisation, la mise à jour
  #    de la Demande d'autorisation, et le verrou du parcours guidé sur téléphone) — et
  #    suivent la même règle que ci-dessus : rien qui puisse bloquer une correction
  #    urgente sans raison.
  # --------------------------------------------------------------------------
  verifier:
    name: Vérifier les fichiers publiés (syntaxe + garde-fous)
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Vérifier la syntaxe de chaque fichier JavaScript
        run: |
          echec=0
          total=0
          while IFS= read -r fichier; do
            total=$((total + 1))
            if node --check "$fichier" 2>/tmp/erreur; then
              echo "  OK     $fichier"
            else
              echec=1
              echo "  CASSÉ  $fichier"
              sed 's/^/         /' /tmp/erreur
            fi
          done < <(find frontend -name '*.js' -type f | sort)

          echo "----------------------------------------------"
          if [ "$echec" -ne 0 ]; then
            echo "PUBLICATION REFUSÉE — au moins un fichier ne se lit pas."
            echo "Le site actuellement en ligne n'est pas remplacé."
            exit 1
          fi
          echo "$total fichiers JavaScript vérifiés, aucun cassé."

      # ----------------------------------------------------------------------
      # M1-B2 / B2-0 et B2-0.5, M1-PUB / R-098 — les GARDE-FOUS de comportement.
      #
      # `node --check` répond à « ce fichier se lit-il ? ». Ceux-ci répondent à « fait-il
      # encore ce qu'il doit faire ? » — trois comportements sont gardés :
      #
      #  · B2-0   : après « Réinitialiser le tournoi », aucune participation de l'édition
      #             effacée ne peut subsister en mémoire, ⭐ MÊME si la relecture des clubs
      #             échoue (l'export PDF de la demande d'autorisation lit cette liste) ;
      #  · B2-0.5 : après un enregistrement qui change une donnée du formulaire FFR, la
      #             « Demande d'autorisation » se met à jour SANS rechargement du navigateur
      #             — sur ordinateur comme sur téléphone —, une panne conserve la dette au
      #             lieu de la faire disparaître, et ⛔ une saisie en cours n'est jamais
      #             effacée. Il porte aussi deux contrôles d'INVENTAIRE : toute action
      #             d'écriture est classée, et aucune n'échappe au point de passage commun.
      #  · R-098  : dans le parcours guidé du TÉLÉPHONE, ouvrir la carte « Publication »
      #             (joignable à tout moment) ne déverrouille AUCUNE autre étape et
      #             n'annonce comme « faite » aucune étape qui ne l'est pas. ⭐ Défaut
      #             constaté en réel le 2026-08-26, sur le site publié.
      #
      # ⚠️ Le dernier fichier éprouve les trois autres : il réintroduit les défauts corrigés
      # dans une COPIE temporaire et exige que les garde-fous les attrapent. Un harnais
      # qu'on n'a jamais vu échouer ne prouve rien — ce projet en a déjà fait les frais.
      #
      # Aucune dépendance, aucun navigateur, quelques secondes. Un échec REFUSE la
      # publication, exactement comme un fichier illisible.
      # ----------------------------------------------------------------------
      - name: Vérifier le comportement de la réinitialisation (M1-B2 / B2-0)
        run: node tests/frontend-reinitialisation.test.js

      - name: Vérifier la mise à jour de la Demande d'autorisation (M1-B2 / B2-0.5)
        run: node tests/frontend-autorisation-sync.test.js

      - name: Vérifier le verrou du parcours guidé (M1-PUB / R-098 — B5)
        run: node tests/frontend-assistant-verrou.test.js

      - name: Vérifier que ces garde-fous mordent encore (rejeu des mutations)
        run: node tests/mutations-frontend.test.js

      # ⭐ M1-B2 / B2-3.d — l'écran des terrains est PUBLIÉ par ce workflow, et son message est
      # ce que le serveur écrira dans le plan de l'édition. Ce banc fait parler le vrai code du
      # navigateur au vrai code du serveur : il a donc sa place ici AUSSI, où il garde ce qui
      # part en ligne. ⛔ Un échec REFUSE la publication, comme un fichier illisible.
      - name: Vérifier l'écran des terrains (M1-B2 / B2-3.d)
        run: node tests/backend-terrains-ecran.test.js

      # ⭐⭐ CE CONTRÔLE-CI GARDE CE FICHIER LUI-MÊME, et c'est délibéré : il lit la structure
      # de ce workflow, en EXTRAIT la condition du job `deploy`, puis l'ÉVALUE sur quatre
      # événements simulés (push, pull request, déclenchement manuel ailleurs, déclenchement
      # manuel sur `main`). ⛔ Il ne cherche pas une chaîne : une condition inversée, ou un
      # simple commentaire, ne le satisferaient pas.
      # 🎯 Il existe parce que « pousser » et « publier » avaient fini par ne faire qu'un
      # seul geste — voir l'encadré « POUSSER N'EST PAS PUBLIER » en tête de ce fichier.
      - name: Vérifier que pousser ne publie pas (séparation push / déploiement)
        run: node tests/pages-deploiement-manuel.test.js

  # --------------------------------------------------------------------------
  # 2) LA PUBLICATION — ⭐ MANUELLE, depuis `main`, et seulement si le contrôle est passé.
  #
  # ⚡ Ce titre disait « ne s'exécute que si le contrôle est passé », et c'était vrai —
  # mais incomplet : il s'exécutait AUSSI à chaque push. ⛔ Deux conditions désormais, et
  # elles doivent être réunies TOUTES LES DEUX :
  #   · le déclenchement est MANUEL (`workflow_dispatch`) — ⛔ ni un push, ni une PR ;
  #   · il vient de la branche `main` — ⛔ pas d'une branche de travail.
  # ⭐ `needs: verifier` est conservé : la publication reste impossible si un contrôle
  # échoue. Les trois verrous se cumulent, ⛔ aucun ne remplace un autre.
  # --------------------------------------------------------------------------
  deploy:
    name: Publier sur GitHub Pages
    needs: verifier                              # ⬅️ le verrou de C-013
    # ⭐⭐ LE DÉPLOIEMENT EST MANUEL, ET SEULEMENT DEPUIS `main`.
    # ⛔ Un push ne publie plus — voir l'encadré « POUSSER N'EST PAS PUBLIER » en tête.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configurer Pages (active Pages si besoin)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Empaqueter le dossier frontend
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./frontend

      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
