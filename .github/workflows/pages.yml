name: Déploiement GitHub Pages (dossier frontend)

# Publie le contenu de `frontend/` sur GitHub Pages à chaque push sur main
# (URLs : https://rfl974.github.io/tournoi-r92/tournoi.html, /admin.html, …).
#
# ⚠️ DEPUIS LE CHANTIER C-013 (R-043) : rien ne part en ligne sans avoir été vérifié.
# Le travail `verifier` s'exécute AVANT `deploy`, et `deploy` en dépend (`needs`).
# Si un fichier JavaScript ne se lit pas, la publication N'A PAS LIEU : le site
# déjà en ligne reste intact.

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/pages.yml'
      # ⛔ `tests/**` N'EST PAS ici, et c'est délibéré : un commit qui ne touche QUE les
      # garde-fous ne change RIEN au site publié. L'ajouter republierait Pages pour rien.
      # ⭐ Les tests tournent quand même à chaque publication réelle : le travail `verifier`
      # les lance à chaque fois qu'il s'exécute, quel que soit le chemin qui l'a déclenché.
  # Le contrôle tourne aussi sur les propositions de fusion : on voit le problème
  # AVANT que le code n'atteigne `main`, pas après. (`deploy` y est neutralisé.)
  pull_request:
    paths:
      - 'frontend/**'
      # ⭐ `tests/**` EST ici, et seulement ici : modifier un garde-fou doit permettre de
      # l'éprouver LUI-MÊME avant fusion — sans jamais rien publier (`deploy` est neutralisé
      # sur les propositions de fusion).
      - 'tests/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch: {}

# Droits minimaux ici ; `deploy` demande les siens pour lui seul (voir plus bas).
# Une exécution déclenchée par une proposition de fusion n'obtient donc JAMAIS
# le droit d'écrire sur Pages.
permissions:
  contents: read

jobs:
  # --------------------------------------------------------------------------
  # 1) LE CONTRÔLE AVANT PUBLICATION — syntaxe + garde-fous comportementaux.
  #
  # ⚠️ Ce commentaire annonçait « syntaxe uniquement », et c'était vrai jusqu'au
  # lot M1-B2 / B2-0.1, qui a ajouté deux étapes de comportement plus bas.
  #
  # a) `node --check` répond à UNE seule question : « ce fichier est-il lisible ? ».
  #    Il ne juge ni le style, ni les conventions, ni la qualité. C'est délibéré :
  #    un contrôle trop exigeant qui refuserait de publier une correction urgente
  #    LE JOUR DU TOURNOI serait pire que pas de contrôle du tout.
  #    Portée : tous les `.js` de `frontend/`, bibliothèques extérieures comprises
  #    (elles sont déposées à la main, donc elles peuvent arriver tronquées).
  #    Le HTML n'est PAS vérifié : il ne contient aucun script en ligne, et
  #    contrôler sa syntaxe exigerait une dépendance que le projet a refusée.
  #
  # b) Les garde-fous de `tests/` répondent à l'autre question : « ce code fait-il
  #    encore ce qu'il doit faire ? ». ⛔ Ils restent VOLONTAIREMENT peu nombreux —
  #    un seul comportement est gardé aujourd'hui — et suivent la même règle que
  #    ci-dessus : rien qui puisse bloquer une correction urgente sans raison.
  # --------------------------------------------------------------------------
  verifier:
    name: Vérifier les fichiers publiés (syntaxe + garde-fous)
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Vérifier la syntaxe de chaque fichier JavaScript
        run: |
          echec=0
          total=0
          while IFS= read -r fichier; do
            total=$((total + 1))
            if node --check "$fichier" 2>/tmp/erreur; then
              echo "  OK     $fichier"
            else
              echec=1
              echo "  CASSÉ  $fichier"
              sed 's/^/         /' /tmp/erreur
            fi
          done < <(find frontend -name '*.js' -type f | sort)

          echo "----------------------------------------------"
          if [ "$echec" -ne 0 ]; then
            echo "PUBLICATION REFUSÉE — au moins un fichier ne se lit pas."
            echo "Le site actuellement en ligne n'est pas remplacé."
            exit 1
          fi
          echo "$total fichiers JavaScript vérifiés, aucun cassé."

      # ----------------------------------------------------------------------
      # M1-B2 / B2-0 — les GARDE-FOUS de comportement.
      #
      # `node --check` répond à « ce fichier se lit-il ? ». Ces deux-ci répondent à
      # « fait-il encore ce qu'il doit faire ? » — et un seul comportement est gardé
      # pour l'instant : après « Réinitialiser le tournoi », aucune participation de
      # l'édition effacée ne peut subsister en mémoire, ⭐ MÊME si la relecture des
      # clubs échoue (l'export PDF de la demande d'autorisation lit cette liste).
      #
      # ⚠️ Le second fichier éprouve le premier : il réintroduit les défauts corrigés
      # dans une COPIE temporaire et exige que le garde-fou les attrape. Un harnais
      # qu'on n'a jamais vu échouer ne prouve rien — ce projet en a déjà fait les frais.
      #
      # Aucune dépendance, aucun navigateur, quelques secondes. Un échec REFUSE la
      # publication, exactement comme un fichier illisible.
      # ----------------------------------------------------------------------
      - name: Vérifier le comportement de la réinitialisation (M1-B2 / B2-0)
        run: node tests/frontend-reinitialisation.test.js

      - name: Vérifier que ce garde-fou mord encore (rejeu des mutations)
        run: node tests/mutations-frontend.test.js

  # --------------------------------------------------------------------------
  # 2) LA PUBLICATION — ne s'exécute que si le contrôle est passé.
  # --------------------------------------------------------------------------
  deploy:
    name: Publier sur GitHub Pages
    needs: verifier                              # ⬅️ le verrou de C-013
    if: github.event_name != 'pull_request'      # jamais depuis une proposition de fusion
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configurer Pages (active Pages si besoin)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Empaqueter le dossier frontend
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./frontend

      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
